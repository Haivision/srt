name: ABI checks

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

env:
  SRT_BASE: v1.5.0

jobs:
  build_pr:
    name: Build current version
    runs-on: ubuntu-latest

    outputs:
       base_version: ${{ steps.build.outputs.SRT_BASE }}
       tag_version: ${{ steps.build.outputs.SRT_TAG_VERSION }}
    steps:

    - uses: actions/checkout@v3
      with:
        path: gitview_pr

    - id: settings
      run: echo "SCRIPTS=$PWD/gitview_pr/scripts/workflows/abi" >> $GITHUB_ENV

    - id: configure
      name: Configure (cmake)
      run: $SCRIPTS/step1-configure-pr.sh

    - id: build
      name: Build and dump
      run: |
        $SCRIPTS/step2-build-pr__OUTPUT.sh $GITHUB_OUTPUT
        echo "--- GITHUB_OUTPUT ---"
        cat $GITHUB_OUTPUT
        echo "---------------------"

    - id: upload_pr_dump
      uses: actions/upload-artifact@v4
      with:
        name: abidump_pr
        path: gitview_pr/_build/libsrt-pr.dump

  build_base:
    name: Build base version
    runs-on: ubuntu-latest
    needs: build_pr
    if: ${{ needs.build_pr.outputs.base_version != '' }}

    env:
       SRT_BASE: ${{ needs.build_pr.outputs.base_version }}
       SRT_TAG_VERSION: ${{ needs.build_pr.outputs.tag_version }}
    steps:

    - uses: actions/checkout@v3
      with:
        path: gitview_pr

    - id: settings
      run: echo "SCRIPTS=$PWD/gitview_pr/scripts/workflows/abi" >> $GITHUB_ENV

    - uses: actions/checkout@v3
      with:
        path: gitview_base
        ref: ${{ env.SRT_BASE }}

    - id: configure_tag
      name: Configure (cmake)
      run: |
        $SCRIPTS/step3-configure-base__SRT_TAG_VERSION__SRT_BASE.sh  $SRT_TAG_VERSION $SRT_BASE
    - id: build_tag
      name: Build and dump
      if: ${{ success() }}
      run: |
        $SCRIPTS/step4-build-base__SRT_BASE.sh $SRT_BASE
    - id: upload_base_dump
      uses: actions/upload-artifact@v4
      with:
        name: abidump_base
        path: gitview_base/_build/libsrt-base.dump

  check_abi:
    name: Compare ABI
    runs-on: ubuntu-latest
    needs: [build_pr, build_base]
    env:
       SRT_BASE: ${{ needs.build_pr.outputs.base_version }}

    steps:

    - uses: actions/checkout@v3
      with:
        path: gitview_pr
    - id: settings
      run: |
         echo "SCRIPTS=$PWD/gitview_pr/scripts/workflows/abi" >> $GITHUB_ENV
    - name: Download base dump
      uses: actions/download-artifact@v4
      with:
        name: abidump_base
        path: .
    - name: Download pr dump
      uses: actions/download-artifact@v4
      with:
        name: abidump_pr
        path: .
    - name: abi-check
      run: |
        $SCRIPTS/prepare-environment.sh
        $SCRIPTS/step5-run-abi-check.sh || RES=$?
        if (( $RES != 0 )); then
           echo "ABI/API Compatibility check failed with value $?"
           echo "RES=$RES" >>$GITHUB_ENV
           exit 0
        fi
    - name: Download report
      uses: actions/upload-artifact@v7
      with:
        name: abi-compliance-report
        path: compat_reports/compat_report.html
        archive: false
    - name: Final result
      run: |
        echo "Final result: $RES"
        exit $RES
